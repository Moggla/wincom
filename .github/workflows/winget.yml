name: Publish to WinGet

on:
  release:
    types: [published]

env:
  WINGET_CREATE_GITHUB_TOKEN: ${{ secrets.WINGET_TOKEN }}

jobs:
  winget:
    name: Publish winget package
    runs-on: windows-latest
    permissions:
      contents: write

    # Only submit stable releases
    # if: ${{ !github.event.release.prerelease }}
    env:
      TAG: ${{ github.event.release.tag_name }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # PS2EXE compiles for Windows PowerShell, so build with powershell instead of pwsh.
      - name: Build wincom.exe
        shell: powershell
        run: |
          Install-Module ps2exe -Scope CurrentUser -Force
          .\build.ps1 -Version $env:TAG

      - name: Upload wincom.exe to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload $env:TAG wincom.exe --clobber

      - name: Download wingetcreate tool
        run: |
          curl.exe -JLO https://aka.ms/wingetcreate/latest

      - name: Submit to WinGet
        run: |
          $version = $env:TAG.TrimStart('v')
          $url = "https://github.com/${{ github.repository }}/releases/download/$env:TAG/wincom.exe"

          .\wingetcreate.exe update Moggla.wincom `
            --version $version `
            --urls "$url|x64" "$url|x86" `
            --submit
