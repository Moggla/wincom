name: Publish to WinGet

on:
  release:
    types: [published]

env:
  WINGET_CREATE_GITHUB_TOKEN: ${{ secrets.WINGET_TOKEN }}

jobs:
  winget:
    name: Publish winget package
    runs-on: windows-latest

    # Only submit stable releases
    # if: ${{ !github.event.release.prerelease }}
    steps:
      - name: Download wingetcreate tool
        run: |
          curl.exe -JLO https://aka.ms/wingetcreate/latest

      # Every step runs in its own shell, so asset lookup and submission share one step.
      # Event data is passed via env instead of ${{ }} interpolation to avoid quoting issues.
      - name: Submit to WinGet
        env:
          TAG: ${{ github.event.release.tag_name }}
          ASSETS: ${{ toJSON(github.event.release.assets) }}
        run: |
          $version = $env:TAG.TrimStart('v')
          $asset = $env:ASSETS | ConvertFrom-Json | Where-Object { $_.name -eq 'wincom.exe' } | Select-Object -First 1
          if (-not $asset) { throw "Release $env:TAG has no wincom.exe asset." }
          $url = $asset.browser_download_url

          .\wingetcreate.exe update Moggla.wincom `
            --version $version `
            --urls "$url|x64" "$url|x86" `
            --submit
